<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24area Library - التقارير</title>
    <link rel="stylesheet" href="assets/style/style.css">
</head>
<body id="reports-page">

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo"><h2>24area Library</h2></div>
        <nav id="sidebar-nav" class="sidebar-nav">
            <ul>
                <li><a href="main.html" class="nav-link">لوحة التحكم</a></li>
                <li><a href="students.html" class="nav-link">الطلاب</a></li>
                <li><a href="sales.html" class="nav-link">المبيعات</a></li>
                <li><a href="reports.html" class="nav-link active">التقارير</a></li>
                <li><a href="users.html" class="nav-link">المستخدمون</a></li>
                <li><a href="settings.html" class="nav-link">الإعدادات</a></li>
            </ul>
        </nav>
    </aside>

    <nav>
        <a href="#reports">التقارير</a>
        <a href="#invoices">الفواتير</a>
    </nav>

    <div id="main-wrapper" class="main-wrapper">
        <header id="topbar" class="topbar">
            <h1 class="page-title" id="reports">التقارير</h1>
        </header>

        <main id="reports-content" class="main-content">
            <section id="report-filter-section" class="search-filter-section">
                <h2>نطاق التقرير</h2>
                <form id="report-filter-form">
                    <div class="form-group">
                        <label for="report-period">الفترة</label>
                        <select id="report-period" name="period">
                            <option value="daily">يومي</option>
                            <option value="weekly">أسبوعي</option>
                            <option value="monthly">شهري</option>
                            <option value="custom">مخصص</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="report-start-date">من تاريخ</label>
                        <input type="date" id="report-start-date" name="start_date">
                    </div>
                    <div class="form-group">
                        <label for="report-end-date">إلى تاريخ</label>
                        <input type="date" id="report-end-date" name="end_date">
                    </div>
                    <button type="submit" class="btn btn-primary">عرض التقرير</button>
                </form>
            </section>
        </main>

        <div id="main-wrapper" class="main-wrapper">
        <header id="topbar" class="topbar">
            <h1 class="page-title" id="invoices">الفواتير</h1>
        </header>

        <main id="invoices-content" class="main-content">
            <section id="invoice-search-section" class="search-filter-section">
                <h2>بحث في الفواتير</h2>
                <form id="invoice-search-form">
                    <div class="form-group">
                        <label for="invoice-search-input">بحث برقم الفاتورة</label>
                        <input type="search" id="invoice-search-input" name="invoice_number">
                    </div>
                    <div class="form-group">
                        <label for="invoice-date-filter">التاريخ</label>
                        <input type="date" id="invoice-date-filter" name="date">
                    </div>
                    <div class="form-group">
                        <label for="invoice-department-filter">القسم</label>
                        <select id="invoice-department-filter" name="department">
                            <option value="">الكل</option>
                            <option value="cafe">البوفيه</option>
                            <option value="stationery">القرطاسية</option>
                            <option value="subscription">الاشتراكات</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary">بحث</button>
                </form>
            </section>
        </main>

    </div>

     <div class="sidebar-footer">
            <a href="index.html" id="logout-btn-sidebar" class="btn btn-logout">تسجيل الخروج</a>
        </div>

        <footer id="reports-footer" class="footer">
            <p>&copy; 2026 24area Library</p>
        </footer>
    </div>

    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                alert('جاري عرض البيانات... (واجهة تجريبية)');
            });
        });
    </script>
</body>
</html>
