<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24area Library - المستخدمون</title>
    <link rel="stylesheet" href="assets/style/style.css">
</head>
<body id="users-page">

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo"><h2>24area Library</h2></div>
        <nav id="sidebar-nav" class="sidebar-nav">
            <ul>
                <li><a href="../main.html" class="nav-link">لوحة التحكم</a></li>
                <li><a href="students.html" class="nav-link">الطلاب</a></li>
                <li><a href="sales.html" class="nav-link">المبيعات</a></li>
                <li><a href="reports.html" class="nav-link">التقارير</a></li>
                <li><a href="users.html" class="nav-link active">المستخدمون</a></li>
                <li><a href="settings.html" class="nav-link">الإعدادات</a></li>
            </ul>
        </nav>
       
    </aside>

    <div id="main-wrapper" class="main-wrapper">
        <header id="topbar" class="topbar">
            <h1 class="page-title">إدارة المستخدمين</h1>
            
        </header>

        <main id="users-content" class="main-content">

            <!-- Add User Form -->
            <section id="add-user-section" class="form-section">
                <h2>إضافة مستخدم جديد</h2>
                <form id="add-user-form" action="#" method="post">

                    <div class="form-group">
                        <label for="user-username">اسم المستخدم</label>
                        <input type="text" id="user-username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="user-fullname">الاسم الكامل</label>
                        <input type="text" id="user-fullname" name="full_name" required>
                    </div>

                    <div class="form-group">
                        <label for="user-role">الدور</label>
                        <select id="user-role" name="role" required>
                            <option value="">-- اختر الدور --</option>
                            <option value="admin">مدير النظام</option>
                            <option value="manager">مدير</option>
                            <option value="cashier">كاشير</option>
                            <option value="viewer">مشاهد</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="user-status">الحالة</label>
                        <select id="user-status" name="status" required>
                            <option value="active">نشط</option>
                            <option value="inactive">غير نشط</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="user-password">كلمة المرور</label>
                        <input type="password" id="user-password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="user-confirm-password">تأكيد كلمة المرور</label>
                        <input type="password" id="user-confirm-password" name="confirm_password" required>
                    </div>
        <!-- Permissions -->
                    <fieldset id="user-permissions-fieldset" class="permissions-fieldset">
                        <legend>الصلاحيات</legend>

                        <label><input type="checkbox" name="permissions[]" value="dashboard"> لوحة التحكم</label>
                        <label><input type="checkbox" name="permissions[]" value="students"> الطلاب</label>
                        <label><input type="checkbox" name="permissions[]" value="subscriptions"> الاشتراكات</label>
                        <label><input type="checkbox" name="permissions[]" value="cafe"> البوفيه</label>
                        <label><input type="checkbox" name="permissions[]" value="stationery"> القرطاسية</label>
                        <label><input type="checkbox" name="permissions[]" value="sales"> المبيعات</label>
                        <label><input type="checkbox" name="permissions[]" value="invoices"> الفواتير</label>
                        <label><input type="checkbox" name="permissions[]" value="reports"> التقارير</label>
                        <label><input type="checkbox" name="permissions[]" value="users"> المستخدمون</label>
                        <label><input type="checkbox" name="permissions[]" value="settings"> الإعدادات</label>
                    </fieldset>

                    <button type="submit" id="add-user-btn" class="btn btn-primary">إضافة مستخدم</button>
                </form>
            </section>

            <!-- Users Table -->
            <section id="users-table-section" class="table-section">
                <h2>قائمة المستخدمين</h2>
                <table id="users-table" class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>اسم المستخدم</th>
                            <th>الاسم الكامل</th>
                            <th>الدور</th>
                            <th>الحالة</th>
                            <th>تعديل</th>
                            <th>حذف</th>
                            <th>تغيير كلمة المرور</th>
                        </tr>
                    </thead>
                    <tbody><!-- صفوف المستخدمين --></tbody>
                </table>
            </section>

        </main>

         <div class="sidebar-footer">
            <a href="../index.html" id="logout-btn-sidebar" class="btn btn-logout">تسجيل الخروج</a>
        </div>

        <footer id="users-footer" class="footer">
            <p>&copy; 2026 24area Library</p>
        </footer>
    </div>

</body>
</html>
